<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2340;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative horizontal rule -->
  <rect x="0" y="580" width="1200" height="8" fill="#f0c040"/>

  <!-- Chamber building icon (centered) -->
  <g transform="translate(540,120)">
    <rect x="20" y="80" width="80" height="60" fill="#f0c040" rx="2"/>
    <polygon points="-20,80 60,20 140,80" fill="#ffffff"/>
    <rect x="27" y="86" width="10" height="52" fill="#1a3a5c" rx="2"/>
    <rect x="55" y="86" width="10" height="52" fill="#1a3a5c" rx="2"/>
    <rect x="83" y="86" width="10" height="52" fill="#1a3a5c" rx="2"/>
    <rect x="45" y="110" width="30" height="30" fill="#1a3a5c" rx="2"/>
    <circle cx="20" cy="50" r="6" fill="#f0c040"/>
    <circle cx="60" cy="36" r="6" fill="#f0c040"/>
    <circle cx="100" cy="50" r="6" fill="#f0c040"/>
  </g>

  <!-- Main title -->
  <text x="600" y="310" font-family="Georgia, serif" font-size="68" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="2">Chamber of Commerce</text>

  <!-- Subtitle -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="36"
        fill="#f0c040" text-anchor="middle" letter-spacing="1">Member Directory</text>

  <!-- Tagline -->
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="24"
        fill="#aaccee" text-anchor="middle">Connecting local businesses · Strengthening our community</text>

  <!-- Bottom bar text -->
  <text x="600" y="618" font-family="Arial, sans-serif" font-size="20"
        fill="#1a3a5c" text-anchor="middle" font-weight="bold">chamber.example.com</text>
</svg>

