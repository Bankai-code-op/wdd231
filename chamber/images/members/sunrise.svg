<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="10" fill="#fef3c7"/>
  <!-- Sun -->
  <circle cx="40" cy="32" r="14" fill="#f59e0b"/>
  <!-- Rays -->
  <line x1="40" y1="10" x2="40" y2="6"  stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="18" x2="61" y2="15" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="36" x2="68" y2="36" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="18" x2="19" y2="15" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="36" x2="12" y2="36" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <!-- Ground / horizon -->
  <rect x="8" y="50" width="64" height="3" rx="1" fill="#d4a017"/>
  <!-- Bread loaf shape -->
  <ellipse cx="40" cy="62" rx="22" ry="10" fill="#92400e"/>
  <ellipse cx="40" cy="58" rx="18" ry="8"  fill="#b45309"/>
  <text x="40" y="77" font-family="Arial" font-size="7" font-weight="bold" fill="#92400e" text-anchor="middle">SUNRISE</text>
