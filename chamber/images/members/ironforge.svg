<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="10" fill="#1c1917"/>
  <!-- Anvil -->
  <rect x="16" y="42" width="48" height="14" rx="3" fill="#78716c"/>
  <rect x="22" y="36" width="36" height="10" rx="2" fill="#a8a29e"/>
