  <!-- Door -->
  <rect x="32" y="50" width="16" height="16" rx="1" fill="#1e3a8a"/>
  <circle cx="45" cy="58" r="1.5" fill="#f59e0b"/>
  <!-- Windows -->
  <rect x="20" y="44" width="10" height="8" rx="1" fill="#bfdbfe"/>
  <rect x="50" y="44" width="10" height="8" rx="1" fill="#bfdbfe"/>
  <!-- For Sale tag -->
  <rect x="22" y="68" width="36" height="10" rx="2" fill="#f59e0b"/>
  <text x="40" y="76" font-family="Arial" font-size="7" font-weight="bold" fill="#1e3a8a" text-anchor="middle">REALTY</text>
