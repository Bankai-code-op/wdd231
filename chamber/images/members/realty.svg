<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="10" fill="#1e3a8a"/>
  <!-- House outline -->
  <polygon points="40,12 10,38 16,38 16,66 64,66 64,38 70,38" fill="#ffffff"/>
  <!-- Roof fill -->
  <polygon points="40,16 14,38 66,38" fill="#bfdbfe"/>
  <!-- Wall -->
